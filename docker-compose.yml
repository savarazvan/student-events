services:
  db:
    image: postgres:16-alpine
    container_name: student_events_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-student_events_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: student_events_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-student_events_db}
      - SECRET_KEY=${SECRET_KEY:-dev-only-insecure-secret-key-change-me-0123456789}
      - ALGORITHM=${ALGORITHM:-HS256}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - TICKET_SECRET=${TICKET_SECRET:-}
      - CHECKIN_OPENS_MINUTES_BEFORE=${CHECKIN_OPENS_MINUTES_BEFORE:-60}
      # Public URL of the frontend; ticket QR codes link to <FRONTEND_URL>/ticket-check
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      # E-mail notifications are disabled while SMTP_HOST is empty (see .env.example)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_FROM=${SMTP_FROM:-UBB Student Events <no-reply@ubb-events.local>}
      - BACKGROUND_JOBS_ENABLED=${BACKGROUND_JOBS_ENABLED:-true}
      - JOBS_INTERVAL_SECONDS=${JOBS_INTERVAL_SECONDS:-30}
    # Aplică migrațiile Alembic + datele inițiale (idempotent), apoi pornește API-ul
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: student_events_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # The dev server proxies /api to the backend container
      - VITE_PROXY_TARGET=http://backend:8000
      # File-change events do not cross the Windows/macOS bind mount
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      # keep the container's own node_modules instead of the host's
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
